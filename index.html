<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghana Nationwide Cadet Corps – Cadet Management Platform</title>
<meta name="description" content="Secure cadet management platform for Senior High Schools across Ghana: musters, announcements, training, attendance and digital cadet ID cards.">
<meta name="theme-color" content="#0f2a1d">
<style>
:root{--side:#0f2a1d;--side2:#173a29;--bg:#f4f3ee;--card:#fff;--ink:#17301f;--mut:#6b7d70;--line:#e6e4dc;--gold:#c9a44c;--chip:#e8efe9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a12;--card:#12281c;--ink:#e9efe9;--mut:#9fb3a5;--line:#244233;--chip:#1c3a2a}}
:root[data-theme="dark"]{--bg:#0b1a12;--card:#12281c;--ink:#e9efe9;--mut:#9fb3a5;--line:#244233;--chip:#1c3a2a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,system-ui,sans-serif;font-size:14px}
h1,h2,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:600}
.demo{background:var(--gold);color:#241a00;font-size:11px;text-align:center;padding:4px;letter-spacing:.5px}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 24px)}
aside{background:var(--side);color:#dfe9e2;padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;padding-bottom:16px;border-bottom:1px solid #ffffff1f}
.mark{width:40px;height:40px;border:1.5px solid var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:18px;flex:none}
.brand b{display:block;letter-spacing:2px;color:#fff}.brand small{font-size:9px;letter-spacing:1.5px;color:#9db3a5}
.who{display:flex;gap:12px;align-items:center;margin:18px 0}
.who i{font-style:normal;width:44px;height:44px;border-radius:10px;background:var(--side2);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.who b{font-size:17px;font-family:Georgia,serif;font-weight:400;color:#fff;display:block}.who small{font-size:10px;color:#9db3a5}
.lab{font-size:10px;letter-spacing:2px;color:#7f9a8b;margin:8px 8px}
aside a{display:block;padding:11px 14px;border-radius:8px;color:#dfe9e2;text-decoration:none;font-size:13px;margin:2px 0;cursor:pointer;border-left:3px solid transparent}
aside a.on{background:var(--side2);border-left-color:var(--gold);color:var(--gold)}
aside a:hover{background:#ffffff0f}
.foot{margin-top:auto;font-size:10px;letter-spacing:1px;color:#6f8a7b;padding:12px 6px}
main{min-width:0}
.bar{display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}
.bar b{color:var(--ink);margin-left:auto;margin-right:auto}
.bar .av{width:36px;height:36px;border-radius:50%;background:var(--chip);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.burger{display:none;background:none;border:0;font-size:22px;color:var(--ink);min-width:44px;min-height:44px;cursor:pointer}
.pg{padding:28px;max-width:1100px}
.eye{font-size:10px;letter-spacing:3px;color:var(--gold);font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 22px}
h1{font-size:34px;color:var(--ink)}.sub{color:var(--mut);font-size:12px;margin-top:6px}
.btn{background:var(--gold);color:#241a00;border:0;border-radius:10px;padding:14px 26px;font-weight:700;font-size:15px;cursor:pointer;min-height:48px}
.btn.o{background:none;border:1px solid var(--line);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.stat small{color:var(--mut);font-size:12px}.stat .n{font-family:Georgia,serif;font-size:32px;margin:10px 0 8px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.card h3{font-size:15px}.card .s{font-size:11px;color:var(--mut);margin:3px 0 14px}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.row .no{width:36px;height:36px;border-radius:8px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.row b{font-weight:500;font-size:13px;display:block}.row small{color:var(--mut);font-size:11px}
.tag{margin-left:auto;background:var(--chip);color:#2f6a45;font-size:10px;padding:4px 12px;border-radius:99px;white-space:nowrap}
.tag.w{background:#fbeccc;color:#7a5a10}
.f{display:grid;grid-template-columns:1fr 1fr;gap:14px}.f .w{grid-column:1/-1}
label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin-bottom:6px}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;background:var(--card);color:var(--ink)}
table{width:100%;border-collapse:collapse}th{font-size:11px;color:var(--mut);text-align:left;padding:10px 8px;font-weight:600}td{padding:12px 8px;border-top:1px solid var(--line);font-size:13px}
.wrapx{overflow-x:auto}
.idc{max-width:380px;background:linear-gradient(150deg,var(--side),#1d4a33);color:#fff;border-radius:18px;padding:24px;border:1px solid var(--gold)}
.idc .ph{width:84px;height:100px;border-radius:10px;background:#ffffff18;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--gold)}
.qr{width:70px;height:70px;background:repeating-conic-gradient(#fff 0 25%,#0f2a1d 0 50%) 0 0/14px 14px;border-radius:6px}
.land{min-height:calc(100vh - 24px);display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(90% 70% at 50% 0,#1d4a33,var(--side))}
.box{background:var(--card);border-radius:20px;padding:34px;width:100%;max-width:460px;border-top:4px solid var(--gold)}
.box h1{font-size:30px;margin:6px 0 8px}.box .mark{margin:0 0 14px}
.sch{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;cursor:pointer;color:var(--ink);font:inherit;min-height:56px}
.sch .mark{width:38px;height:38px;font-size:12px;font-weight:700}.sch small{color:var(--mut);display:block;font-size:11px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.choice .sch{display:block;text-align:center;padding:22px 10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:12px 20px;border-radius:10px;z-index:30;border:1px solid var(--gold)}
@media(max-width:860px){.shell{grid-template-columns:1fr}aside{position:fixed;left:0;top:0;width:260px;z-index:20;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}.burger{display:block}.stats{grid-template-columns:1fr 1fr}.two,.f{grid-template-columns:1fr}.pg{padding:18px}h1{font-size:28px}.bar{padding:8px 12px}}
.cam{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;border:2px solid var(--card);background:var(--gold);cursor:pointer;font-size:13px;padding:0}.mark svg{width:70%;height:70%}.sm{min-height:36px!important;padding:6px 14px!important;font-size:12px!important}</style>
</head>
<body>
<div class="demo">DEMO PREVIEW · sample data only · no real cadet records</div>
<div id="v"></div>
<script>
var S={school:{n:'Accra Academy',r:'Accra, Greater Accra Region',a:'AA'}};
var schools=[{n:'Accra Academy',r:'Accra, Greater Accra Region',a:'AA'},{n:'Achimota School',r:'Accra, Greater Accra Region',a:'AS'},{n:'Kumasi High School',r:'Kumasi, Ashanti Region',a:'KH'},{n:'Tamale SHS',r:'Tamale, Northern Region',a:'TS'},{n:'PRESEC Legon',r:'Accra, Greater Accra Region',a:'PL'}];
var NAV={cadet:[['Overview','c-home'],['Musters','c-musters'],['Announcements','c-news'],['Training','c-training'],['Meeting schedule','c-training'],['Digital ID card','c-id'],['History of Cadets','c-history'],['More','c-more'],['My profile','c-profile']],
admin:[['Overview','a-home'],['Cadets','a-cadets'],['Add cadet','a-add'],['Take attendance','a-att'],['Send muster','a-muster'],['Announcements','a-news'],['Training','a-training'],['Reports','a-rep'],['Officers','a-off'],['School profile','a-prof']],
owner:[['Schools','o-schools'],['Add school','o-add'],['Bulk import','o-bulk']]};
var RL={cadet:'Cadet Member Portal',admin:'School Admin Portal',owner:'Platform Admin Portal'},CID='AA-ACC-2026-001';
function go(p){location.hash=p}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}
function shell(role,cur,eye,title,sub,act,body){var nav=NAV[role].map(function(n){return '<a class="'+(n[1]==cur?'on':'')+'" onclick="go(\''+n[1]+'\')">'+n[0]+'</a>'}).join('');
return '<div class="shell"><aside id="sd"><div class="brand"><div class="mark">♜</div><div><b>GHANA NCC</b><small>'+S.school.n.toUpperCase()+' CADET CORPS</small></div></div><div class="who"><i style="overflow:hidden">'+(role=='admin'&&S.photos.oc?'<img src="'+S.photos.oc+'" style="width:100%;height:100%;object-fit:cover">':role=='owner'?'★':S.school.a)+'</i><div><b>'+(role=='owner'?'Platform Admin':S.school.n)+'</b><small>'+RL[role]+'</small></div></div><div class="lab">MAIN MENU</div>'+nav+'<a onclick="go(\'welcome\')" style="margin-top:10px">Log out</a><div class="foot">GHANA NCC · PREVIEW 0.1</div></aside><main><div class="bar"><button class="burger" onclick="document.getElementById(\'sd\').classList.toggle(\'open\')" aria-label="Menu">☰</button>'+RL[role]+' /<b>'+title+'</b><span class="av">'+(role=='cadet'?'KA':'AO')+'</span></div><div class="pg"><div class="eye">'+eye.toUpperCase()+'</div><div class="hd"><div><h1>'+title+'</h1><div class="sub">'+sub+'</div></div>'+(act||'')+'</div>'+body+'</div></main></div>'}
function stats(a){return '<div class="stats">'+a.map(function(x){return '<div class="card stat"><small>'+x[0]+'</small><div class="n">'+x[1]+'</div><small>'+x[2]+'</small></div>'}).join('')+'</div>'}
function rows(a,t){return a.map(function(x,i){return '<div class="row"><div class="no">'+(t=='n'?'✦':'0'+(i+1))+'</div><div><b>'+x[0]+'</b><small>'+x[1]+'</small></div>'+(x[2]?'<span class="tag">'+x[2]+'</span>':'')+'</div>'}).join('')}
var acts=[['Company Muster','Friday · 07:00 AM · Cadet Square','Upcoming'],['Leadership briefing','Friday · 07:00 AM · Cadet Square','Upcoming'],['Inter-unit training','Friday · 07:00 AM · Cadet Square','Upcoming']];
var news=[['Cadet Corps weekly briefing','Open to view details'],['Uniform reminder','Open to view details'],['Training notice','Open to view details']];
function two(l,r){return '<div class="two"><div class="card"><h3>'+l[0]+'</h3><div class="s">'+l[1]+'</div>'+l[2]+'</div><div class="card"><h3>'+r[0]+'</h3><div class="s">'+r[1]+'</div>'+r[2]+'</div></div>'}
function form(fs,btn){return '<div class="card"><div class="f">'+fs.map(function(f){var t=f[1];var i=t=='photo'?pic(f[2]||'new',84):t=='sel'?'<select data-k="'+f[0]+'"><option>Select</option>'+f[2].map(function(o){return '<option>'+o+'</option>'}).join('')+'</select>':t=='ta'?'<textarea rows="3" data-k="'+f[0]+'"></textarea>':'<input type="'+t+'" data-k="'+f[0]+'">';return '<div class="'+(f[3]?'w':'')+'"><label>'+f[0]+'</label>'+i+'</div>'}).join('')+'</div><div style="margin-top:18px"><button class="btn" onclick="submitF()">'+btn+'</button></div></div>'}
function table(h,r){return '<div class="card wrapx"><table><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr>'+r.map(function(x){return '<tr>'+x.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'}
var REG=['Greater Accra','Ashanti','Central','Eastern','Western','Western North','Volta','Oti','Northern','Savannah','North East','Upper East','Upper West','Bono','Bono East','Ahafo'];
var SEAL='<svg viewBox="0 0 48 56"><path d="M24 2 44 9v18c0 14-9 22-20 27C13 49 4 41 4 27V9z" fill="#0f2a1d" stroke="#c9a44c" stroke-width="2.5"/><path d="M24 9 39 14v13c0 10-6 16-15 20-9-4-15-10-15-20V14z" fill="none" stroke="#c9a44c"/><path d="m24 18 3 7h7l-6 4 2 7-6-4-6 4 2-7-6-4h7z" fill="#c9a44c"/></svg>';
S.photos={};S.att=[];S.ev=acts;S.news=[['Cadet parade notice','All cadets in full uniform','New'],['Training schedule update','Training begins Monday','Training'],['Inter-school drill competition','Prepare for the competition','Events']];
S.cadets=[{id:CID,name:'Demo Cadet One',rank:'Cadet',svc:'Army',st:'Active'},{id:'AA-ACC-2026-002',name:'Demo Cadet Two',rank:'Corporal',svc:'Navy',st:'Active'},{id:'AA-ACC-2026-003',name:'Demo Cadet Three',rank:'Cadet',svc:'Police',st:'Pending'}];
function up(k){var i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=function(){var f=i.files[0];if(!f)return;if(f.size>5e6){toast('Image must be under 5 MB');return}var r=new FileReader();r.onload=function(){S.photos[k]=r.result;document.querySelectorAll('[data-p="'+k+'"]').forEach(function(e){e.outerHTML=pic(k,+e.dataset.s,e.dataset.fb)})};r.readAsDataURL(f)};i.click()}
function pic(k,z,fb){fb=fb||'👤';return '<div data-p="'+k+'" data-s="'+z+'" data-fb="'+fb+'" style="position:relative;width:'+z+'px;height:'+z+'px;flex:none"><div style="width:100%;height:100%;border-radius:12px;background:var(--chip);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:'+z/3+'px">'+(S.photos[k]?'<img src="'+S.photos[k]+'" alt="" style="width:100%;height:100%;object-fit:cover">':fb)+'</div>'+(z>=60?'<button class="cam" onclick="event.stopPropagation();up(\''+k+'\')" aria-label="Upload photo">📷</button>':'')+'</div>'}
function ctab(q){q=(q||'').toLowerCase();return table(['','Cadet ID','Name','Rank','Status',''],S.cadets.filter(function(c){return (c.name+c.id).toLowerCase().indexOf(q)>-1}).map(function(c){return [pic(c.id,36),c.id,c.name,c.rank,'<span class="tag'+(c.st=='Active'?'':' w')+'">'+c.st+'</span>','<button class="btn o sm" onclick="up(\''+c.id+'\')">Photo</button>']}))}
function val(k){var e=document.querySelector('[data-k="'+k+'"]');return e&&e.value!='Select'?e.value.trim():''}
function tg(i){schools[i].on=schools[i].on===false;route()}
function saveAtt(){var p=0,n=[];S.cadets.forEach(function(c,i){if(document.getElementById('at'+i).value=='Present')p++;else n.push(c.name)});S.att.unshift({d:new Date().toDateString(),s:document.getElementById('sess').value,p:p,a:n.length,n:n});toast('Attendance saved');route()}
function submitF(){var h=location.hash.slice(1),t;
if(h=='a-add'){var nm=val('Full name'),id=val('Cadet ID');if(!nm||!id){toast('Name and Cadet ID are required');return}if(S.cadets.some(function(c){return c.id==id})){toast('That Cadet ID already exists in this school');return}S.cadets.unshift({id:id,name:nm,rank:val('Rank')||'Cadet',svc:val('Service category')||'Army',st:'Active'});if(S.photos.new){S.photos[id]=S.photos.new;delete S.photos.new}toast('Cadet registered successfully');go('a-cadets')}
else if(h=='a-muster'||h=='a-training'){t=val('Title')||val('Programme');if(!t){toast('A title is required');return}S.ev.unshift([t,(val('Date')||'Date TBA')+' · '+(val('Time')||'')+' '+(val('Venue')||''),'Upcoming']);toast('Published – cadets can now see it');go('a-home')}
else if(h=='a-news'){t=val('Title');if(!t){toast('A title is required');return}S.news.unshift([t,val('Message')||'Open to view details',val('Category')||'General']);toast('Announcement published');go('a-home')}
else if(h=='a-prof'){S.school.n=val('School name')||S.school.n;S.school.a=(val('Abbreviation')||S.school.a).toUpperCase().slice(0,3);toast('School profile saved');route()}
else if(h=='o-add'){t=val('Official school name');if(!t){toast('School name is required');return}schools.unshift({n:t,r:val('Town')+', '+(val('Region')||'Ghana'),a:(val('Abbreviation')||t.slice(0,2)).toUpperCase(),on:true});toast('School successfully registered on the Ghana Nationwide Cadet Corps platform.');go('o-schools')}
else if(h=='o-bulk'){var c=0;val('Paste list').split('\n').forEach(function(l){var p=l.split(',');if(p[0].trim()){schools.push({n:p[0].trim(),r:(p[2]||'').trim()+', '+(p[1]||'').trim(),a:p[0].trim().slice(0,2).toUpperCase(),on:true});c++}});toast(c+' schools imported');go('o-schools')}}
var P={
welcome:function(){return '<div class="land"><div class="box" style="text-align:center"><div class="mark" style="margin:0 auto 14px">♜</div><div class="eye">REPUBLIC OF GHANA</div><h1>Ghana Nationwide<br>Cadet Corps</h1><p class="sub" style="font-style:italic;margin-bottom:22px">Discipline • Leadership • Excellence</p><div style="display:flex;justify-content:space-around;font-size:11px;color:var(--mut);margin-bottom:24px"><span>⚓<br>Navy</span><span>⚔<br>Army</span><span>🛡<br>Police</span><span>✈<br>Air Force</span></div><button class="btn" style="width:100%" onclick="go(\'search\')">Search for school</button><p class="sub" style="margin-top:14px"><a onclick="go(\'olo\')" style="cursor:pointer;text-decoration:underline">Platform administrator</a></p></div></div>'},
search:function(){return '<div class="land"><div class="box"><div class="eye">STEP 1 OF 3</div><h1>Find your school</h1><p class="sub" style="margin-bottom:14px">Only registered Senior High Schools appear here.</p><input id="q" placeholder="e.g. Accra Academy" oninput="flt()"><div id="list"></div><button class="btn o" style="margin-top:16px;width:100%" onclick="go(\'welcome\')">Back</button></div></div>'},
access:function(){return '<div class="land"><div class="box" style="text-align:center"><div class="mark" style="margin:0 auto 14px">'+S.school.a+'</div><div class="eye">SCHOOL SELECTED</div><h1>'+S.school.n+'</h1><p class="sub">Choose how you want to log in.</p><div class="choice"><button class="sch" onclick="go(\'clogin\')"><b>Cadet Member</b><small>For all cadets</small></button><button class="sch" onclick="go(\'alogin\')"><b>Admin</b><small>OC, 2IC, Adjutant, CSM</small></button></div><button class="btn o" style="margin-top:16px;width:100%" onclick="go(\'search\')">Change school</button></div></div>'},
clogin:function(){return login('Cadet Member login','Enter your Cadet ID','c-home','Contact your school officer if you have any issues.')},
alogin:function(){return login('Admin login','Enter your Admin access code','a-home','Only authorised school personnel may sign in.')},
'c-home':function(){return shell('cadet','c-home','Accra Academy','Cadet overview','Your cadet activities, updates and personal information.','<button class="btn" onclick="go(\'c-id\')">View ID card</button>',stats([['My attendance','96%','This academic term'],['Upcoming activities','04','Musters and training'],['New announcements','03','Unread updates'],['Training sessions','12','Completed this term']])+two(['Your upcoming activities','Latest updates and activities',rows(S.ev.slice(0,3))],['Latest announcements','Important information',rows(S.news.slice(0,3),'n')]))},
'c-musters':function(){return shell('cadet','c-musters','Musters','Musters','Upcoming musters and your attendance history.','',two(['Next muster','Details',rows([['Sat, 15 Nov 2026','07:00 AM · Main Parade Ground','Upcoming']])],['Muster history','Attendance record',rows([['Sat, 01 Nov 2026','Present','Completed'],['Sat, 25 Oct 2026','Present','Completed'],['Sat, 18 Oct 2026','Present','Completed']])]))},
'c-news':function(){return shell('cadet','c-news','Announcements','Announcements','All notices published for your school.','',rows(S.news,'n').replace(/^/,'<div class="card">')+'</div>')},
'c-training':function(){return shell('cadet','c-training','Training','Training & meetings','Programmes and meeting schedule.','',two(['Meeting schedule','Upcoming',rows([['Monthly meeting','Sat, 15 Nov 2026'],['Drill practice','Sat, 22 Nov 2026'],['Leadership seminar','Sat, 29 Nov 2026']])],['Training programme','This term',rows([['Basic drill','Weekly'],['First aid','Fortnightly']])]))},
'c-id':function(){return shell('cadet','c-id','Digital ID','Digital ID card','Show this card for verification.','','<div class="idc"><div class="eye">GHANA NCC · '+S.school.n.toUpperCase()+'</div><div style="display:flex;gap:16px;margin:16px 0">'+pic(CID,100)+'<div><h2 style="font-size:20px">Cadet Demo Name</h2><small>ID AA-ACC-2026-001</small><br><small>Rank: Cadet · Army</small><br><small>Form 3 · House: Demo</small></div></div><div style="display:flex;justify-content:space-between;align-items:center"><small>Scan to verify</small><div class="qr"></div></div></div>')},
'c-history':function(){return shell('cadet','c-history','Learn','History of Cadets','Key milestones (sample text – to be verified before launch).','','<div class="card">'+rows([['1957','Cadet movement introduced (sample)'],['1970','Expansion to more SHS (sample)'],['Present','Unified cadet corps (sample)']],'n')+'</div>')},
'c-profile':function(){return shell('cadet','c-profile','Account','My profile','Your personal information.','','<div class="card" style="margin-bottom:16px;display:flex;gap:16px;align-items:center">'+pic(CID,90)+'<div><h2>Cadet Demo Name</h2><div class="sub">Photo appears on your digital ID card</div></div></div>'+table(['Field','Value'],[['Cadet ID','AA-ACC-2026-001'],['Full name','Cadet Demo Name'],['Class / Form','Form 3'],['Rank','Cadet'],['Service','Army'],['School',S.school.n]]))},
'a-home':function(){return shell('admin','a-home','Accra Academy','Admin overview','Manage your school’s cadet unit.','<button class="btn" onclick="go(\'a-add\')">Add cadet</button> <button class="btn o" onclick="go(\'a-att\')">Take attendance</button>',stats([['Registered cadets',S.cadets.length,'Total'],['Active cadets','230','Currently active'],['Pending','20','Awaiting approval'],['Upcoming events','05','Musters and meetings']])+two(['Upcoming musters & meetings','Next 7 days',rows(S.ev.slice(0,3))],['Recent activity','Latest actions',rows([['New cadet registered','Today, 10:24'],['Muster results updated','Today, 09:15'],['Meeting scheduled','Yesterday']],'n')]))},
'a-cadets':function(){return shell('admin','a-cadets','Cadets','Manage cadets','Search registered cadets and upload photos.','<button class="btn" onclick="go(\'a-add\')">Add cadet</button>','<input placeholder="Search by name or Cadet ID" oninput="document.getElementById(\'ct\').innerHTML=ctab(this.value)" style="margin-bottom:14px"><div id="ct">'+ctab('')+'</div>')},
'a-add':function(){return shell('admin','a-add','Registration','Add cadet member','The school name is taken from your login.','',form([['Full name','text'],['Cadet ID','text'],['Gender','sel',['Male','Female']],['Date of birth','date'],['Class / Form','sel',['Form 1','Form 2','Form 3']],['Rank','sel',['Cadet','Corporal','Sergeant']],['Service category','sel',['Navy','Army','Police','Air Force']],['Phone','tel'],['Profile photo','photo','new']],'Register cadet'))},
'a-muster':function(){return shell('admin','a-muster','Notices','Send muster / meeting','Published items appear on cadets’ dashboards.','',form([['Title','text',0,1],['Date','date'],['Time','time'],['Venue','text'],['Send to','sel',['All cadets','Selected class','Selected group']],['Instructions','ta',0,1]],'Publish'))},
'a-news':function(){return shell('admin','a-news','Notices','Send announcement','Broadcast to your cadets.','',form([['Title','text',0,1],['Category','sel',['General','Training','Events','Important Notices']],['Send to','sel',['All cadets','Selected group']],['Message','ta',0,1]],'Publish announcement'))},
'a-training':function(){return shell('admin','a-training','Training','Training management','Programmes and schedules.','',form([['Programme','text'],['Date','date'],['Type','sel',['Drill practice','Leadership training']],['Venue','text']],'Add programme'))},
'a-att':function(){var r=S.cadets.map(function(c,i){return '<tr><td>'+c.name+'<br><small class="sub">'+c.id+'</small></td><td><select id="at'+i+'" style="min-height:40px"><option>Present</option><option>Absent</option><option>Excused</option></select></td></tr>'}).join('');return shell('admin','a-att','Attendance','Take attendance','Mark today’s attendance – '+new Date().toDateString()+'.','<button class="btn" onclick="saveAtt()">Save attendance</button>','<div class="card wrapx"><label>Session</label><select id="sess" style="margin-bottom:12px"><option>Muster</option><option>Drill practice</option><option>Training</option></select><table><tr><th>Cadet</th><th>Status</th></tr>'+r+'</table></div><div class="card" style="margin-top:16px"><h3>Attendance history</h3><div class="s">Saved sessions</div>'+(S.att.length?S.att.map(function(a){return '<div class="row"><div><b>'+a.d+' · '+a.s+'</b><small>Present '+a.p+' · Absent '+a.a+(a.n.length?' · Absentees: '+a.n.join(', '):'')+'</small></div></div>'}).join(''):'<div class="sub">No attendance saved yet.</div>')+'</div>')},
'a-rep':function(){var l=S.att[0];return shell('admin','a-rep','Reports','Reports','Live figures from this demo session.','',stats([['Total cadets',S.cadets.length,'Registered'],['Sessions recorded',S.att.length,'Attendance'],['Last present',l?l.p:'–','Latest session'],['Last absent',l?l.a:'–','Latest session']]))},
'a-off':function(){return shell('admin','a-off','Leadership','School officers','Upload each officer’s photo. The OC photo appears on the admin login and sidebar.','','<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">'+['OC','2IC','Adjutant','CSM','MIC'].map(function(r){return '<div class="card" style="text-align:center"><div style="display:flex;justify-content:center;margin-bottom:12px">'+pic(r=='OC'?'oc':r,r=='OC'?120:84)+'</div><b>'+r+'</b><div class="sub">'+(r=='OC'?'Officer Commanding':'Officer')+'</div></div>'}).join('')+'</div>')},
'a-prof':function(){return shell('admin','a-prof','Branding','School profile','Your school’s identity, shown to your cadets.','',form([['School name','text'],['Abbreviation','text'],['Motto','text'],['School badge','photo','badge'],['Campus photo','photo','campus'],['Cadet corps photo','photo','corps']],'Save profile'))},
'c-more':function(){return shell('cadet','c-more','Resources','More','Ranks, uniform guidelines, FAQs and support.','',two(['Ranks & insignia','Sample – confirm with your corps',rows([['Cadet','Entry rank'],['Corporal','Junior leader'],['Sergeant','Senior leader']])],['Uniform, FAQ & support','',rows([['Uniform guidelines','Full uniform on parade days'],['FAQ','Ask your school officer'],['Contact support','Contact to be added']],'n')]))},
'o-schools':function(){var on=schools.filter(function(x){return x.on!==false}).length;return shell('owner','o-schools','Platform','Manage schools','Showing the first 50 registered Senior High Schools.','<button class="btn" onclick="go(\'o-add\')">Add school</button> <button class="btn o" onclick="go(\'o-bulk\')">Bulk import</button>',stats([['Total schools',schools.length,'Registered'],['Active',on,'Visible in search'],['Inactive',schools.length-on,'Hidden']])+table(['School','Region','Status',''],schools.slice(0,50).map(function(x,i){return [x.n,x.r,'<span class="tag'+(x.on===false?' w':'')+'">'+(x.on===false?'Inactive':'Active')+'</span>','<button class="btn o sm" onclick="tg('+i+')">'+(x.on===false?'Activate':'Deactivate')+'</button>']})))},
'o-add':function(){return shell('owner','o-add','Registration','Add school','Register a Senior High School on the platform.','',form([['Official school name','text',0,1],['Abbreviation','text'],['Region','sel',REG],['Town','text'],['Email','email'],['Telephone','tel'],['Motto','text',0,1]],'Register school'))},
'o-bulk':function(){return shell('owner','o-bulk','Registration','Bulk import schools','Paste one school per line: Name, Region, Town. Import hundreds at once.','',form([['Paste list','ta',0,1]],'Import schools'))},
olo:function(){return login('Platform admin login','Enter your platform access code','o-schools','Restricted to the platform owner.')}
};
function login(t,ph,dest,help){return '<div class="land"><div class="box"><div class="mark" style="width:76px;height:76px;overflow:hidden">'+(dest=='a-home'&&S.photos.oc?'<img src="'+S.photos.oc+'" style="width:100%;height:100%;object-fit:cover">':'♜')+'</div><div class="eye">'+(dest=='o-schools'?'GHANA NCC PLATFORM':S.school.n.toUpperCase())+'</div><h1>'+t+'</h1><p class="sub" style="margin-bottom:16px">'+ph+'</p><input id="code" type="password" autocomplete="off" placeholder="Access code"><button class="btn" style="width:100%;margin-top:14px" onclick="if(!code.value){toast(\'Please enter your code\')}else{go(\''+dest+'\')}">Log in</button><button class="btn o" style="width:100%;margin-top:10px" onclick="go(\'access\')">Back</button><p class="sub" style="margin-top:14px">'+help+'<br>Demo: any code works. Real login will use Supabase Auth.</p></div></div>'}
function flt(){var q=(document.getElementById('q').value||'').toLowerCase();document.getElementById('list').innerHTML=schools.filter(function(s){return s.on!==false&&s.n.toLowerCase().indexOf(q)>-1}).slice(0,8).map(function(s){return '<button class="sch" onclick="pick('+schools.indexOf(s)+')"><div class="mark">'+s.a+'</div><div><b>'+s.n+'</b><small>'+s.r+'</small></div></button>'}).join('')||'<p class="sub" style="margin-top:12px">No active school found.</p>'}
function pick(i){S.school=schools[i];go('access')}
function route(){var p=(location.hash||'#welcome').slice(1);if(!P[p])p='welcome';document.getElementById('v').innerHTML=P[p]().split('♜').join(SEAL);if(p=='search')flt();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
