<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghana Nationwide Cadet Corps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--g9:#0B3D2E;--g7:#145A3D;--gold:#D6A928;--bg:#F5F7F5;--panel:#FFFFFF;--ink:#17231D;--mut:#4A5A52;--line:#D5DED8;--field:#FFFFFF;--soft:#EDF3EF;--err:#B3261E;--ok-bg:#DDEFE5;--ok:#0F5A38;--warn-bg:#F8EBC2;--warn:#6B5200;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1612;--panel:#15221C;--ink:#EAF1ED;--mut:#A9BAB0;--line:#2A3B32;--field:#0F1B15;--soft:#1B2B23;--err:#FF8A80;--ok-bg:#1D3D2D;--ok:#8FE0B4;--warn-bg:#44370D;--warn:#F2D77A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1612;--panel:#15221C;--ink:#EAF1ED;--mut:#A9BAB0;--line:#2A3B32;--field:#0F1B15;--soft:#1B2B23;--err:#FF8A80;--ok-bg:#1D3D2D;--ok:#8FE0B4;--warn-bg:#44370D;--warn:#F2D77A;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,"Segoe UI",Arial,sans-serif}
h1,h2,h3{font-family:"Noto Serif",Georgia,"Times New Roman",serif;line-height:1.2;margin:0}
h1{font-size:clamp(1.7rem,5vw,2.2rem)}h2{font-size:1.6rem}
p{margin:0}
.banner{background:var(--gold);color:var(--g9);text-align:center;font-size:.8rem;font-weight:600;padding:5px 10px}
.flag{height:4px;background:linear-gradient(90deg,#CE1126 33.3%,#FCD116 33.3% 66.6%,#006B3F 66.6%)}
.mut{color:var(--mut)}.sm{font-size:.9rem}.eye{color:var(--g7);font-weight:600;font-size:.9rem}
:root[data-theme="dark"] .eye{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .eye{color:var(--gold)}}
a{color:inherit}
.hero{min-height:calc(100vh - 4px);background:var(--g9);display:grid;place-items:center;padding:24px 16px}
.card{background:var(--panel);border-radius:14px;border-top:4px solid var(--gold);box-shadow:0 8px 28px rgba(0,0,0,.28);padding:28px 24px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.card.c{text-align:center;align-items:stretch}.card.wide{max-width:600px}
.crest{display:flex;justify-content:center}
.cats{list-style:none;margin:6px 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats li{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--g7);font-size:.85rem;font-weight:500;padding:10px 4px;border:1px solid var(--line);border-radius:10px}
:root[data-theme="dark"] .cats li{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cats li{color:var(--gold)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:10px;border:1px solid transparent;font:600 1rem Inter,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.block{width:100%}
.btn.gold{background:var(--gold);color:var(--g9)}.btn.green{background:var(--g7);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:hover{filter:brightness(1.07)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.link{color:var(--g7);font-weight:500}
:root[data-theme="dark"] .link{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:var(--gold)}}
.in,select.in{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:1rem Inter,system-ui,sans-serif}
label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:.95rem}
.err{color:var(--err);font-size:.88rem;min-height:1em}
.row{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;margin-top:8px}
.row:hover{background:var(--soft)}
.badge{flex:none;width:44px;height:44px;border-radius:10px;border:1.5px solid var(--gold);display:grid;place-items:center;font-weight:600;font-size:.8rem;color:var(--g7);background:var(--soft)}
:root[data-theme="dark"] .badge{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{color:var(--gold)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:99px;padding:6px 12px;font:.88rem Inter,sans-serif;cursor:pointer}
.pick{display:flex;gap:12px;align-items:center;padding:14px;border:1.5px solid var(--g7);border-radius:12px;background:var(--soft);text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--g7);background:var(--soft)}.opt svg{color:var(--g7)}
:root[data-theme="dark"] .opt svg{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .opt svg{color:var(--gold)}}
.card.split{max-width:820px;flex-direction:row;padding:0;overflow:hidden;gap:0}
.spl-l{flex:1;background:var(--g7);color:#fff;padding:36px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.spl-r{flex:1.1;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 4px)}
.side{background:var(--g9);color:#E6EFEA;padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 16px}.brand small{display:block;color:#B7C9BF;font-size:.78rem}
.lbl{color:#B7C9BF;font-size:.8rem;padding:6px 10px}
.side a,.side button{display:block;text-align:left;background:none;border:0;color:inherit;font:500 .95rem Inter,sans-serif;padding:11px 12px;border-radius:8px;text-decoration:none;cursor:pointer}
.side a:hover,.side button:hover{background:rgba(255,255,255,.08)}
.side a.on{background:rgba(255,255,255,.1);box-shadow:inset 3px 0 0 var(--gold);color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.av{width:34px;height:34px;border-radius:50%;background:var(--g7);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:600}
.body{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1000px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat b{display:block;font:700 2rem "Noto Serif",serif;color:var(--g7)}
:root[data-theme="dark"] .stat b{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stat b{color:var(--gold)}}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:.95rem}th{color:var(--mut);font-weight:600}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.82rem;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.g2 table{min-width:0}.full{grid-column:1/-1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--g9);color:#fff;border:1px solid var(--gold);padding:12px 18px;border-radius:10px;font-size:.95rem;max-width:90vw;display:none;z-index:9}
@media (max-width:820px){
.app{grid-template-columns:1fr}.side{flex-direction:row;align-items:center;overflow-x:auto;padding:8px}.brand,.lbl{display:none}.side a,.side button{white-space:nowrap}
.side a.on{box-shadow:inset 0 -3px 0 var(--gold)}.top,.body{padding-left:16px;padding-right:16px}
.card.split{flex-direction:column}.two,.g2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.emb{display:inline-block;border-radius:14px;border:2px solid var(--gold);background:#0B3D2E;object-fit:contain;padding:5px}
.hero{background:linear-gradient(rgba(11,61,46,.93),rgba(11,61,46,.93)),var(--cadet) center/cover,var(--g9)}
.spl-l{background:linear-gradient(rgba(11,61,46,.82),rgba(11,61,46,.9)),var(--cadet) center 20%/cover,var(--g7)}
.card.hero2{max-width:880px;flex-direction:row;padding:0;overflow:hidden;gap:0;text-align:center}
.hero2 .photo{flex:1;min-height:280px;background:var(--cadetp) center/cover,var(--g9)}
.hero2 .txt{flex:1.15;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
@media (max-width:820px){.card.hero2{flex-direction:column}.hero2 .photo{min-height:230px;background:var(--cadet) center/cover,var(--g9)}}
textarea.in{resize:vertical}.col{display:flex;flex-direction:column;gap:12px}.panel h3{font-size:1.05rem;margin-bottom:8px}.panel p{margin:6px 0 0}
.idc{max-width:420px;border-radius:16px;overflow:hidden;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25)}.idh{display:flex;gap:12px;align-items:center;padding:14px 16px}.idh small{opacity:.85}
.idb{display:flex;gap:14px;padding:16px;background:rgba(255,255,255,.08)}.ph{width:84px;height:104px;flex:none;border-radius:10px;background:rgba(255,255,255,.14);border:1.5px solid;display:grid;place-items:center;font:700 1.6rem "Noto Serif",serif}
.idb dl{margin:0;display:grid;gap:2px}.idb dt{font-size:.78rem;opacity:.8}.idb dd{margin:0 0 6px;font-weight:600}.idf{padding:8px 16px;font-size:.8rem;color:#0B3D2E;text-align:center;font-weight:600}
.main{min-width:0}.body{max-width:none}
.pick2{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}.ph2{width:84px;height:104px;flex:none;border-radius:10px;border:1.5px dashed var(--gold);display:grid;place-items:center;color:var(--mut);overflow:hidden}.ph2 img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div class="flag"></div>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const REG=["Ahafo","Ashanti","Bono","Bono East","Central","Eastern","Greater Accra","North East","Northern","Oti","Savannah","Upper East","Upper West","Volta","Western","Western North"];
const CAT=["Navy","Army","Police","Air Force"];
const ic={Navy:'<circle cx="12" cy="5" r="2"/><path d="M12 7v14M8 11h8M4 15c1 4 4 6 8 6s7-2 8-6"/>',Army:'<path d="M5 4l14 14M19 4L5 18M4 20h4M16 20h4"/>',Police:'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/>',"Air Force":'<path d="M12 4v16M2 10l10 3 10-3-3 6-7-2-7 2z"/>',Cadet:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 5a3 3 0 010 6M18 14c2 .8 3 3 3 6"/>',Camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',Admin:'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>'};
const svg=(n,s=26)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic[n]}</svg>`;
const IMG={arms:"images/arms.png",cadet:"images/hero-l.jpg",cadetp:"images/hero-p.jpg"};const rs=document.documentElement.style;rs.setProperty("--cadet","url("+IMG.cadet+")");rs.setProperty("--cadetp","url("+IMG.cadetp+")");
const crest=(s=44)=>`<img class="emb" src="${IMG.arms}" width="${s+16}" height="${s+16}" alt="Ghana coat of arms">`;

const S={prof:null,picked:null,me:null,q:"",found:[],schools:[],db:{},pp:null};
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",3200)}

const V={};
V.welcome=()=>`<main class="hero"><section class="card hero2"><div class="photo" role="img" aria-label="Ghana cadets on parade"></div><div class="txt"><div class="crest">${crest(84)}</div><p class="eye">Republic of Ghana</p><h1>Ghana Nationwide Cadet Corps</h1><p class="mut">Discipline • Leadership • National Service</p><ul class="cats">${CAT.map(c=>`<li>${svg(c)}<span>${c}</span></li>`).join("")}</ul><a class="btn gold block" href="#search">Search for school</a><a class="link" href="#login">Platform administrator</a></div></section></main>`;

V.search=()=>{const p=S.picked;return `<main class="hero"><section class="card"><div class="crest">${crest(40)}</div>`+(p?
`<p class="eye">Step 2 of 3</p><h2>Confirm your school</h2><div class="pick"><span class="badge">${esc(p.abbr)}</span><div><b>${esc(p.name)}</b><div class="mut sm">${esc(p.town)}${p.town?", ":""}${esc(p.region)} · ${esc(p.category)} Cadets</div>${p.motto?`<div class="sm"><i>“${esc(p.motto)}”</i></div>`:""}</div></div><a class="btn green block" href="#access">Continue</a><button class="btn ghost block" data-act="unpick">Choose a different school</button>`:
`<p class="eye">Step 1 of 3</p><h2>Find your school</h2><p class="mut sm">Only registered Senior High Schools appear here.</p><input id="q" class="in" placeholder="e.g. Accra Academy" value="${esc(S.q)}" autocomplete="off" aria-label="School name"><div id="res" aria-live="polite"></div><a class="btn ghost block" href="#welcome">Back</a>`)+`</section></main>`};

V.access=()=>{const p=S.picked;return `<main class="hero"><section class="card wide"><div class="crest">${crest(40)}</div><p class="eye">Step 3 of 3 · ${esc(p.name)}</p><h2>Access portal</h2><p class="mut sm">Choose how you want to access this school’s portal.</p><div class="two"><button class="opt" data-act="who" data-w="Cadet Member">${svg("Cadet",34)}<b>Cadet Member</b><span class="mut sm">Log in to your cadet account</span></button><button class="opt" data-act="who" data-w="Admin">${svg("Admin",34)}<b>Admin Access</b><span class="mut sm">For school administrators</span></button></div><a class="btn ghost block" href="#search">Back</a></section></main>`};

V.login=()=>`<main class="hero"><section class="card split"><div class="spl-l">${crest(64)}<h2>Ghana Cadet Corps</h2><p>Together for a Disciplined Ghana</p></div><div class="spl-r"><h2>Platform admin login</h2><p class="mut sm">Sign in with your platform administrator account.</p>${FD("lg",[["email","Email address","email",1],["password","Password","password",1]],"Log in","col")}<a class="btn ghost block" href="#welcome">Back</a><p class="mut sm">Restricted to the platform owner.</p></div></section></main>`;

const shell=(on,title,body)=>`<div class="app"><nav class="side" aria-label="Platform admin"><div class="brand">${crest(34)}<div><b>GHANA NCC</b><small>Your school cadet corps</small></div></div><span class="lbl">Main menu</span><a href="#schools" class="${on==="schools"?"on":""}">Schools</a><a href="#add" class="${on==="add"?"on":""}">Add school</a><button data-act="bulk">Bulk import</button><button data-act="out">Log out</button></nav><div class="main"><header class="top"><span class="mut sm">Platform Admin Portal / <b>${title}</b></span><span class="av" aria-label="Platform admin">PA</span></header><div class="body">${body}</div></div></div>`;

V.schools=()=>{const a=S.schools.filter(s=>s.active).length;return shell("schools","Manage schools",`<div class="head"><div><p class="eye">Platform</p><h2>Manage schools</h2><p class="mut sm">Showing the first 50 registered Senior High Schools.</p></div><div class="acts"><a class="btn gold" href="#add">Add school</a><button class="btn ghost" data-act="bulk">Bulk import</button></div></div><div class="stats"><div class="panel stat"><span class="mut sm">Total schools</span><b>${S.schools.length}</b><span class="mut sm">Registered</span></div><div class="panel stat"><span class="mut sm">Active</span><b>${a}</b><span class="mut sm">Visible in search</span></div><div class="panel stat"><span class="mut sm">Inactive</span><b>${S.schools.length-a}</b><span class="mut sm">Hidden</span></div></div><div class="panel tw"><table><thead><tr><th>School</th><th>Region</th><th>Category</th><th>Status</th></tr></thead><tbody>${S.schools.map(s=>`<tr><td><b>${esc(s.name)}</b><br><span class="mut sm">${esc(s.abbr)}</span></td><td>${esc(s.region)}</td><td>${esc(s.category)}</td><td><span class="pill ${s.active?"ok":"warn"}">${s.active?"Active":"Inactive"}</span></td></tr>`).join("")}</tbody></table></div>`)};

V.add=()=>shell("add","Add school",`<div><p class="eye">Registration</p><h2>Add school</h2><p class="mut sm">Register a Senior High School and create its administrator login.</p></div>${FD("fsch",[["name","Official school name","text",1],["abbr","Abbreviation"],["region","Region","",1,REG],["town","Town"],["email","School email","email"],["tel","Telephone","tel"],["category","Cadet category","",1,CAT],["motto","Motto"],["pay","Payment status","",1,["Paid","Pending"]],["aemail","School admin email","email",1],["apw","School admin temporary password (8+ characters)","password",1]],"Register school")}`);

function drawRes(){const box=$("#res");if(!box)return;
 if(!S.q.trim()){box.innerHTML='<p class="mut sm" style="margin-top:8px">Start typing to see registered schools.</p>';return}
 box.innerHTML=S.found.length?S.found.map(s=>`<button class="row" data-act="pick" data-id="${s.id}"><span class="badge">${esc(s.abbr||"–")}</span><span><b>${esc(s.name)}</b><br><small class="mut">${esc(s.region)}</small></span></button>`).join(""):'<p class="mut sm" style="margin-top:8px">No school found. If your school has registered, ask the platform administrator.</p>'}

/* ---- School admin + cadet portals. Sample data lives in S.db (one store per school) so it can move to Supabase later ---- */
const iso=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fdt=i=>new Date(i+"T00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const ini=n=>n.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
const D=()=>S.db[S.picked.id]||(S.db[S.picked.id]={cadets:[],events:[],ann:[],train:[],officers:[],att:[]});
const NAV={a:[["a-home","Overview"],["a-cadets","Cadets"],["a-add","Add cadet"],["a-att","Take attendance"],["a-muster","Send muster"],["a-ann","Announcements"],["a-train","Training"],["a-reports","Reports"],["a-officers","Officers"],["a-prof","School profile"]],c:[["c-home","Dashboard"],["c-id","Digital ID"],["c-muster","Musters"],["c-ann","Announcements"],["c-train","Training"],["c-meet","Meetings"]]};
const pshell=(r,on,title,sub,body,act="")=>{const s=S.picked;return `<div class="app"><nav class="side" aria-label="${r==="a"?"School admin":"Cadet"}"><div class="brand">${s.logo?`<img class="emb" src="${s.logo}" width="44" height="44" alt="School logo">`:`<span class="badge">${esc(s.abbr)}</span>`}<div><b>${esc(s.name)}</b><small>${r==="a"?"School admin portal":"Cadet portal"}</small></div></div><span class="lbl">Main menu</span>${NAV[r].map(([h,l])=>`<a href="#${h}" class="${h===on?"on":""}">${l}</a>`).join("")}<button data-act="pout">Log out</button></nav><div class="main"><header class="top"><span class="mut sm">${esc(s.name)} / <b>${title}</b></span><span class="av">${r==="a"?"AD":S.me.photo?`<img src="${S.me.photo}" alt="" style="width:34px;height:34px;border-radius:50%;object-fit:cover">`:esc(ini(S.me.name))}</span></header><div class="body"><div class="head"><div><h2>${title}</h2><p class="mut sm">${sub}</p></div>${act}</div>${body}</div></div></div>`};
const av=(c,s=36)=>c.photo?`<img src="${c.photo}" alt="" style="width:${s}px;height:${s}px;border-radius:50%;object-fit:cover">`:`<span class="badge" style="width:${s}px;height:${s}px;border-radius:50%">${esc(ini(c.name))}</span>`;
const st=(a,b,c)=>`<div class="panel stat"><span class="mut sm">${a}</span><b>${b}</b><span class="mut sm">${c}</span></div>`;
const tbl=(h,r,em)=>r.length?`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.map(c=>`<tr>${c.map(x=>`<td>${x&&x.h?x.h:esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:`<p class="mut" style="padding:8px 0">${em}</p>`;

/* ---- Supabase data layer (all data lives in your Supabase project; nothing is seeded) ---- */
let sb=null;
const mapSchool=s=>({id:s.id,name:s.name,abbr:s.abbreviation||"",region:s.region,town:s.town||"",category:s.category,motto:s.motto||"",active:s.active,logo:s.logo_url,oc:s.oc_name||"",c1:s.color1,c2:s.color2});
const cadetEmail=(sid,no)=>no.toLowerCase().replace(/[^a-z0-9]/g,"")+"."+sid+"@cadets.gncc.app";
const go=h=>{location.hash=h};
async function loadSchools(){const {data,error}=await sb.from("schools").select("*").order("created_at",{ascending:false});if(error)throw error;S.schools=(data||[]).map(mapSchool)}
async function loadSchool(){const id=S.picked.id,q=t=>sb.from(t).select("*").eq("school_id",id);
 const r=await Promise.all([q("cadets").order("full_name"),q("events").order("event_date"),q("announcements").order("created_at",{ascending:false}),q("training").order("training_date"),q("officers"),q("attendance")]);
 const bad=r.find(x=>x.error);if(bad)throw bad.error;const [c,e,a,t,o,at]=r.map(x=>x.data||[]);
 const cn={},g={};c.forEach(x=>cn[x.id]=x.cadet_no);
 at.forEach(x=>{const k=x.session_title+"|"+x.session_date;(g[k]=g[k]||{sess:x.session_title,date:x.session_date,st:{}}).st[cn[x.cadet_id]||x.cadet_id]=x.status});
 S.db[id]={cadets:c.map(x=>({uid:x.id,id:x.cadet_no,name:x.full_name,gender:x.gender,form:x.form,rank:x.rank,phone:x.phone,photo:x.photo_url,status:x.status})),
  events:e.map(x=>({kind:x.kind,title:x.title,date:x.event_date,time:(x.event_time||"").slice(0,5),venue:x.venue||""})),
  ann:a.map(x=>({title:x.title,body:x.body,date:x.created_at.slice(0,10)})),
  train:t.map(x=>({prog:x.programme,date:x.training_date,type:x.type,venue:x.venue||""})),
  officers:o.map(x=>({pos:x.position,cid:cn[x.cadet_id]||""})),
  att:Object.values(g).sort((x,y)=>y.date.localeCompare(x.date))};
 if(S.prof&&S.prof.role==="cadet")S.me=S.db[id].cadets.find(x=>x.uid===S.prof.cadet_id)||null}
async function setProf(session){S.prof=null;if(!session)return;
 const {data}=await sb.from("profiles").select("role,school_id,cadet_id").eq("id",session.user.id).maybeSingle();S.prof=data;
 if(data&&data.school_id&&!S.picked){const r=await sb.from("schools").select("*").eq("id",data.school_id).maybeSingle();if(r.data)S.picked=mapSchool(r.data)}}
async function findSchools(){const q=S.q.trim().replace(/[%_,]/g,"");if(!q){S.found=[];drawRes();return}
 const {data}=await sb.from("schools").select("*").eq("active",true).ilike("name","%"+q+"%").limit(10);S.found=(data||[]).map(mapSchool);drawRes()}
async function signIn(email,pw,want,sid){const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
 if(error)return "Those details are not correct.";await setProf(data.session);const p=S.prof;
 if(!p||p.role!==want||(sid&&p.school_id!==sid)){await sb.auth.signOut();S.prof=null;return "This account cannot open this portal."}return ""}
async function api(kind,body){const {data:{session}}=await sb.auth.getSession();if(!session)return "Please sign in again.";
 const r=await fetch("/api/create-user",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify({kind,...body})});
 const j=await r.json().catch(()=>({}));return r.ok?"":(j.error||"The request failed. Please try again.")}
const shrink=(f,m,type="image/jpeg")=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL(type,.85))};im.src=r.result};r.readAsDataURL(f)});

/* ---- forms ---- */
const sid=()=>S.picked.id;
const ok=(r,m)=>{if(r.error)return r.error.message;toast(m);return ""};
const CHK={fadd:d=>{const er={};if(D().cadets.some(c=>c.id.toLowerCase()===d.cadetId.trim().toLowerCase()))er.cadetId="This cadet ID is already registered.";if(d.password.length<8)er.password="Use at least 8 characters.";return er},
 fsch:d=>d.apw.length<8?{apw:"Use at least 8 characters."}:{}};
const SAVE={
 lg:async d=>{const e=await signIn(d.email.trim(),d.password,"platform_admin");if(!e)go("schools");return e},
 alg:async d=>{const e=await signIn(d.email.trim(),d.password,"school_admin",sid());if(!e)go("a-home");return e},
 clg:async d=>{const e=await signIn(cadetEmail(sid(),d.cid.trim()),d.password,"cadet",sid());if(!e)go("c-home");return e},
 fsch:async d=>{const e=await api("school",{school:{name:d.name.trim(),abbr:d.abbr.trim(),region:d.region,town:d.town.trim(),email:d.email.trim(),tel:d.tel.trim(),category:d.category,motto:d.motto.trim(),pay:d.pay},adminEmail:d.aemail.trim(),adminPassword:d.apw});if(!e){toast("School registered: "+d.name.trim());go("schools")}return e},
 fadd:async d=>{const e=await api("cadet",{cadet:{id:d.cadetId.trim(),name:d.name.trim(),gender:d.gender,dob:d.dob,form:d.form,rank:d.rank,phone:d.phone.trim(),photo:S.pp||""},password:d.password});if(!e){S.pp=null;toast(d.name.trim()+" added.");go("a-cadets")}return e},
 fev:async d=>ok(await sb.from("events").insert({school_id:sid(),kind:d.kind,title:d.title.trim(),event_date:d.date,event_time:d.time,venue:d.venue.trim()}),d.kind+" sent: "+d.title.trim()),
 fann:async d=>ok(await sb.from("announcements").insert({school_id:sid(),title:d.title.trim(),body:d.body.trim()}),"Announcement published."),
 ftr:async d=>ok(await sb.from("training").insert({school_id:sid(),programme:d.prog.trim(),training_date:d.date,type:d.type,venue:d.venue.trim()}),"Programme added."),
 fof:async d=>{const c=D().cadets.find(x=>x.id===d.cid.split(" – ")[0]);return ok(await sb.from("officers").upsert({school_id:sid(),position:d.pos,cadet_id:c.uid},{onConflict:"school_id,position"}),d.pos+" appointed.")},
 fpr:async d=>{const r=await sb.from("schools").update({name:d.name.trim(),abbreviation:d.abbr.trim()||null,motto:d.motto.trim()||null,oc_name:d.oc.trim()||null,color1:d.c1,color2:d.c2}).eq("id",sid());
  if(!r.error)Object.assign(S.picked,{name:d.name.trim(),abbr:d.abbr.trim(),motto:d.motto.trim(),oc:d.oc.trim(),c1:d.c1,c2:d.c2});return ok(r,"School profile updated.")}};
document.addEventListener("submit",async e=>{const f=e.target,fs=FORMS[f.id];if(!fs)return;e.preventDefault();const d=Object.fromEntries(new FormData(f)),er={};
 fs.forEach(([n,,,r])=>{if(r&&!String(d[n]||"").trim())er[n]="This field is required."});
 if(!Object.keys(er).length&&CHK[f.id])Object.assign(er,CHK[f.id](d));
 f.querySelectorAll(".err").forEach(x=>x.textContent=er[x.dataset.f]||"");
 const bad=f.querySelector(".err:not(:empty)");if(bad){bad.closest("label").querySelector("input,select,textarea").focus();return}
 const btn=f.querySelector("button:not([type=button])"),h0=location.hash;if(btn)btn.disabled=true;
 let m="";try{m=await SAVE[f.id](d)}catch(x){m="Something went wrong. Please try again."}
 if(btn)btn.disabled=false;if(m){toast(m);return}if(location.hash===h0)render()});

/* ---- clicks, inputs, photos ---- */
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
 if(a==="pick"){S.picked=S.found.find(s=>s.id===t.dataset.id);render()}
 else if(a==="unpick"){S.picked=null;S.q="";S.found=[];render()}
 else if(a==="who")go(t.dataset.w==="Admin"?"a-login":"c-login");
 else if(a==="bulk")toast("Bulk import is not part of this version.");
 else if(a==="out"||a==="pout")sb.auth.signOut().then(()=>{S.prof=null;S.me=null;go(a==="out"?"welcome":"access")});
 else if(a==="cam")document.querySelector("input[capture]").click();
 else if(a==="gal")document.querySelector("input[data-k]:not([capture])").click();
 else if(a==="att"){const x={};document.querySelectorAll(".st").forEach(s=>x[s.dataset.id]=s.value);const ss=$("#sess");
  if(!Object.keys(x).length||!ss||ss.value==="No sessions yet"){toast("Add cadets and a session first.");return}
  const title=ss.selectedOptions[0].text.split(" · ")[0],rows=D().cadets.map(c=>({school_id:sid(),cadet_id:c.uid,session_title:title,session_date:ss.value,status:x[c.id]||"Present"}));
  sb.from("attendance").upsert(rows,{onConflict:"cadet_id,session_title,session_date"}).then(r=>{toast(r.error?r.error.message:"Attendance saved.");render()})}});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;clearTimeout(findSchools.t);findSchools.t=setTimeout(findSchools,250)}});
document.addEventListener("change",e=>{const t=e.target,f=t.files&&t.files[0];if(!f)return;
 if(t.dataset.k)shrink(f,240).then(u=>{S.pp=u;$("#pvw").innerHTML='<img alt="Photo preview" src="'+u+'">'}).catch(()=>toast("That image could not be read. Try another photo."));
 else if(t.id==="logo")shrink(f,256,"image/png").then(u=>sb.from("schools").update({logo_url:u}).eq("id",sid()).then(r=>{if(r.error)return toast(r.error.message);S.picked.logo=u;render()})).catch(()=>toast("That image could not be read."))});

/* ---- routing with real role checks ---- */
async function render(){let h=location.hash.slice(1)||"welcome";if(!V[h])h="welcome";if(!sb)return;if(h!=="a-add")S.pp=null;
 const role=S.prof&&S.prof.role,p=S.picked,mine=p&&S.prof&&S.prof.school_id===p.id;
 if((h==="schools"||h==="add")&&role!=="platform_admin")return go("login");
 if((h==="access"||/^[ac]-/.test(h))&&!p)return go("search");
 if(/^a-(?!login)/.test(h)&&!(role==="school_admin"&&mine)||/^c-(?!login)/.test(h)&&!(role==="cadet"&&mine))return go("access");
 try{if(h==="schools")await loadSchools();if(/^[ac]-(?!login)/.test(h)){await loadSchool();if(h[0]==="c"&&!S.me){toast("Your cadet record could not be found. Ask your school administrator.");return go("access")}}}
 catch(x){toast("Could not load data. Check your connection and try again.")}
 $("#app").innerHTML=V[h]();if(h==="search"&&!S.picked)drawRes();window.scrollTo(0,0)}
window.addEventListener("hashchange",render);
